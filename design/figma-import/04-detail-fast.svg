<text x="366" y="50" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#555555" text-anchor="end" dominant-baseline="middle" letter-spacing="0">보문역 2번 출구</text>
