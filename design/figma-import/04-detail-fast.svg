<text x="64" y="692" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="16" font-weight="600" fill="#2F7D4A" text-anchor="start" dominant-baseline="middle" letter-spacing="0">2분 · 좌석 이용 여건 개선 예상</text>
