<text x="333" y="697" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="800" fill="#2F7D4A" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">여유</text>
<rect x="24" y="716" width="342" height="72" rx="8" fill="#FFF4D6" stroke="none" stroke-width="1"/>
<g transform="translate(42 739) scale(0.9166666666666666)"><path d="M10.3 3.8 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z" fill="none" stroke="#B86E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9v4M12 17h.01" fill="none" stroke="#B86E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="78" y="736" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="14" font-weight="600" fill="#555555" text-anchor="start" letter-spacing="0"><tspan x="78" dy="0">앉기 편한 시간은 여유 예상 구간만 더한 값이며</tspan><tspan x="78" dy="20">혼잡 구간에서는 좌석 이용이 어려울 수 있어요.</tspan></text>
<text x="195" y="824" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="800" fill="#B8560A" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">버스 비교로 돌아가기</text>
