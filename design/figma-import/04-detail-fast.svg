<text x="24" y="148" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="17" font-weight="500" fill="#555555" text-anchor="start" dominant-baseline="middle" letter-spacing="0">보문역·동대문 방면 · 일반버스</text>
