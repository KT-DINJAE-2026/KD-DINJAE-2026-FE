<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교통약자 버스 서비스 · Figma 시안</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f0f0ef; color: #191919; font-family: "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 28px; color: #555555; }
    .flow { display: block; width: min(100%, 1440px); margin-bottom: 36px; border: 1px solid #dddddd; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 390px)); gap: 28px; align-items: start; }
    figure { margin: 0; }
    figure img { display: block; width: 100%; border: 1px solid #dddddd; box-shadow: 0 10px 30px rgba(25,25,25,.08); }
    figcaption { padding-top: 10px; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>교통약자 버스 서비스 · Figma 시안</h1>
  <p>출발 정류장에서 입력한 도착 정류장까지 운행하는 버스를 비교하는 모바일 프로토타입입니다.</p>
  <img class="flow" src="./00-user-flow.svg" alt="사용자 흐름도">
  <main>
  <figure>
    <img src="./01-destination-stop.svg" alt="01 도착 정류장 검색">
    <figcaption>01 도착 정류장 검색</figcaption>
  </figure>
  <figure>
    <img src="./02-analyzing.svg" alt="02 버스 분석 중">
    <figcaption>02 버스 분석 중</figcaption>
  </figure>
  <figure>
    <img src="./03-compare.svg" alt="03 버스 비교">
    <figcaption>03 버스 비교</figcaption>
  </figure>
  <figure>
    <img src="./03-compare-unavailable.svg" alt="03-B 혼잡도 데이터 부족">
    <figcaption>03-B 혼잡도 데이터 부족</figcaption>
  </figure>
  <figure>
    <img src="./04-detail.svg" alt="04 구간별 상세">
    <figcaption>04 구간별 상세</figcaption>
  </figure>
  <figure>
    <img src="./04-detail-fast.svg" alt="04-A 빠른 버스 상세">
    <figcaption>04-A 빠른 버스 상세</figcaption>
  </figure>
  <figure>
    <img src="./04-detail-unavailable.svg" alt="04-B 데이터 부족 상세">
    <figcaption>04-B 데이터 부족 상세</figcaption>
  </figure></main>
</body>
</html>
