<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교통약자 버스 서비스 · Figma 시안</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f0f0ef; color: #191919; font-family: "Noto Sans CJK KR", "Malgun Gothic", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 28px; color: #555555; }
    .flow { display: block; width: min(100%, 1440px); margin-bottom: 36px; border: 1px solid #dddddd; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 390px)); gap: 28px; align-items: start; }
    figure { margin: 0; }
    figure img { display: block; width: 100%; border: 1px solid #dddddd; box-shadow: 0 10px 30px rgba(25,25,25,.08); }
    figcaption { padding-top: 10px; font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>교통약자 버스 서비스 · Figma 시안</h1>
  <p>목적지까지 빠른 버스와 덜 붐비는 버스를 함께 비교하는 모바일 프로토타입입니다.</p>
  <img class="flow" src="./00-user-flow.svg" alt="사용자 흐름도">
  <main>
  <figure>
    <img src="./01-destination.svg" alt="01 목적지 입력">
    <figcaption>01 목적지 입력</figcaption>
  </figure>
  <figure>
    <img src="./02-alighting.svg" alt="02 하차 정류장 확인">
    <figcaption>02 하차 정류장 확인</figcaption>
  </figure>
  <figure>
    <img src="./03-analyzing.svg" alt="03 버스 분석 중">
    <figcaption>03 버스 분석 중</figcaption>
  </figure>
  <figure>
    <img src="./04-compare.svg" alt="04 덜 붐비는 버스 비교">
    <figcaption>04 덜 붐비는 버스 비교</figcaption>
  </figure>
  <figure>
    <img src="./04-compare-fast.svg" alt="04-A 빠른 도착 비교">
    <figcaption>04-A 빠른 도착 비교</figcaption>
  </figure>
  <figure>
    <img src="./04-compare-unavailable.svg" alt="04-B 혼잡도 데이터 부족">
    <figcaption>04-B 혼잡도 데이터 부족</figcaption>
  </figure>
  <figure>
    <img src="./05-detail.svg" alt="05 구간별 상세">
    <figcaption>05 구간별 상세</figcaption>
  </figure>
  <figure>
    <img src="./05-detail-fast.svg" alt="05-A 빠른 버스 상세">
    <figcaption>05-A 빠른 버스 상세</figcaption>
  </figure>
  <figure>
    <img src="./06-selected-comfort.svg" alt="06 덜 붐비는 버스 선택 완료">
    <figcaption>06 덜 붐비는 버스 선택 완료</figcaption>
  </figure>
  <figure>
    <img src="./06-selected-fast.svg" alt="06-A 빠른 버스 선택 완료">
    <figcaption>06-A 빠른 버스 선택 완료</figcaption>
  </figure></main>
</body>
</html>
